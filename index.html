<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Knicks @ Spurs — Live</title>
<style>
  :root{
    --bg:#05060a; --card:#0e1018; --muted:#8b91a4; --line:#1c2030;
    --away:#1d428a;   /* Knicks blue */
    --home:#9aa3ad;   /* Spurs silver */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}

  /* Compact tile pinned top-left, capped at 256x300 */
  .widget{
    position:fixed;top:0;left:0;
    width:256px;height:300px;max-width:256px;max-height:300px;
    display:flex;flex-direction:column;
    padding:10px 12px;color:#fff;overflow:hidden;
    background:#000;
  }

  .status{
    flex:0 0 auto;align-self:center;
    font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;
    padding:4px 10px;border-radius:999px;border:1px solid var(--line);
    background:var(--card);white-space:nowrap;margin-bottom:8px;
  }
  .status.live{border-color:#ff3b3b;background:#ff3b3b22;animation:pulse 2s infinite}
  .status.final{border-color:#3ad17a;color:#9cf3c0}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 #ff3b3b55}50%{box-shadow:0 0 0 6px #ff3b3b00}}

  .row{
    flex:1 1 0;display:flex;align-items:center;justify-content:space-between;
    gap:10px;min-height:0;padding:0 14px;
  }
  .logo{width:104px;height:104px;object-fit:contain;flex:0 0 auto}
  .score{font-size:56px;font-weight:900;font-variant-numeric:tabular-nums;line-height:.85;letter-spacing:-1px;flex:0 0 auto}

  .mid{
    flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;
    padding:5px 0;margin:2px 0;
  }
  .period{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
  .clock{font-size:15px;font-weight:900;font-variant-numeric:tabular-nums}

  .footer{
    flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:6px;
    color:var(--muted);font-size:9px;font-weight:600;margin-top:6px;
  }
  .footer .venue{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .footer .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#3ad17a;margin-right:4px;vertical-align:middle}
  .footer .stale .dot{background:#ff8c3b}
  #updated{flex:0 0 auto;white-space:nowrap}
</style>
</head>
<body>
  <div class="widget">
    <div id="status" class="status" style="display:none"></div>

    <div class="row away">
      <img id="awayLogo" class="logo" alt="">
      <div class="score" id="awayScore">0</div>
    </div>

    <div class="mid">
      <span class="period" id="period"></span>
      <span class="clock" id="clock"></span>
    </div>

    <div class="row home">
      <img id="homeLogo" class="logo" alt="">
      <div class="score" id="homeScore">0</div>
    </div>

    <div class="footer">
      <span id="updated"><span class="dot"></span><span id="updatedText">—</span></span>
    </div>
  </div>

<script>
const SCOREBOARD = "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard";
const WANT = new Set(["NY","SA"]);      // Knicks & Spurs abbreviations
const REFRESH_MS = 12000;               // poll every 12s
const $ = id => document.getElementById(id);

function findGame(data){
  for(const ev of (data.events||[])){
    const comp = (ev.competitions||[])[0];
    if(!comp) continue;
    const abbrs = comp.competitors.map(c=>c.team.abbreviation);
    if(abbrs.some(a=>WANT.has(a))) return ev;
  }
  return null;
}

function setTeam(side, c){
  $(side+"Logo").src = c.team.logo || "";
  $(side+"Score").textContent = c.score ?? "0";
}

function render(ev){
  const comp = ev.competitions[0];
  const home = comp.competitors.find(c=>c.homeAway==="home");
  const away = comp.competitors.find(c=>c.homeAway==="away");
  setTeam("home", home);
  setTeam("away", away);

  const st = ev.status;
  const state = st.type.state;            // pre | in | post
  const statusEl = $("status");
  statusEl.className = "status";
  if(state==="pre"){
    statusEl.style.display = "none";      // no date/time shown pre-game
    $("clock").textContent = "";
    $("period").textContent = "Tip-off";
  } else if(state==="in"){
    statusEl.style.display = "";
    statusEl.classList.add("live");
    statusEl.textContent = "● Live";
    $("clock").textContent = st.displayClock || "";
    $("period").textContent = periodLabel(st.period);
  } else { // post
    statusEl.style.display = "";
    statusEl.classList.add("final");
    statusEl.textContent = st.type.shortDetail || "Final";
    $("clock").textContent = "";
    $("period").textContent = st.period>4 ? "Final/OT" : "Final";
  }
}

function periodLabel(p){
  if(!p) return "";
  if(p<=4) return "Q"+p;
  return "OT"+(p-4);
}

let lastOk = 0;
async function tick(){
  try{
    const res = await fetch(SCOREBOARD + "?_=" + Date.now(), {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const data = await res.json();
    const ev = findGame(data);
    if(!ev){ $("status").textContent = "Game not found"; return; }
    render(ev);
    lastOk = Date.now();
    markFresh(true);
  }catch(e){
    markFresh(false, e.message);
  }
}

function markFresh(ok){
  const wrap = $("updated");
  const txt = $("updatedText");
  const d = new Date(lastOk||Date.now());
  const hh = d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  if(ok){
    wrap.classList.remove("stale");
    txt.textContent = hh;
  }else{
    wrap.classList.add("stale");
    txt.textContent = "reconnecting…";
  }
}

tick();
setInterval(tick, REFRESH_MS);
</script>
</body>
</html>
